<main class="viz">
  <header class="viz-header">
    <h2>割り勘</h2>
    <p class="viz-description">合計と人数を変えて、一人分を確認。</p>
  </header>
  <section class="viz-result" aria-live="polite">
    <span class="viz-caption">一人あたり</span>
    <output class="viz-value" id="amount">￥3,000</output>
    <span class="viz-caption" id="summary">4人で ￥12,000</span>
  </section>
  <section class="viz-controls" aria-label="計算の条件">
    <label>合計（円）<input id="total" type="number" min="0" max="100000000" value="12000" inputmode="numeric"></label>
    <label><span class="viz-row">人数 <output id="count">4人</output></span><input id="people" type="range" min="1" max="12" value="4"></label>
  </section>
  <p class="viz-caption">端数は1円単位で切り上げ。</p>
</main>
<script>
const money = new Intl.NumberFormat('ja-JP', {style:'currency',currency:'JPY',maximumFractionDigits:0});
function update(){
  const n = Number(document.getElementById('people').value);
  const total = Math.max(0,Number(document.getElementById('total').value)||0);
  document.getElementById('count').textContent = n+'人';
  document.getElementById('amount').textContent = money.format(Math.ceil(total/n));
  document.getElementById('summary').textContent = n+'人で '+money.format(total);
}
document.getElementById('people').addEventListener('input', update);
document.getElementById('total').addEventListener('input', update);
update();
</script>
